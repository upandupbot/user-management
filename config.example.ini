; Copy this file to config.ini and fill in your real values.
; config.ini is gitignored because it contains secrets (API token, key paths).

[Pipefy]
source = up-and-up
pipefy_api_url = https://api.pipefy.com/graphql
pipefy_api_token = <your Pipefy API token>
; org_id = <optional; auto-detected from the pipe if omitted>

[PaperTrail]
; Optional remote logging. Leave blank to disable.
papertrail_log_token =
papertrail_host = logs.papertrailapp.com
; papertrail_port = 12345

[Web]
; Optional. Set a shared password to require sign-in (company email + this
; password) before the web UI can be used. REQUIRED when hosting publicly
; (Render / Fly.io). Prefer the SWAP_WEB_PASSWORD env var on hosted setups.
; password = <shared team password>
; secret_key = <optional; session-cookie signing key. Auto-derived if omitted>

[Audit]
; Optional. Mirror applied swaps into a shared Google Sheet. Pick ONE method.
;
; Option A — Service account (recommended; works even when your Workspace
; blocks anonymous Apps Script web apps). See swap_assignee/sheets_sink.py for
; the full setup. Share the Sheet with the service account's client_email as
; Editor, then point service_account_file at the downloaded JSON key.
; sheet_id = <spreadsheet id, the part of the URL between /d/ and /edit>
; service_account_file = C:\path\to\service-account-key.json
;
; Option B — Apps Script web app (only if your Workspace allows anonymous web
; apps; many block it with a 403 "You need access" page).
; webhook_url = https://script.google.com/macros/s/XXXXXXXX/exec
