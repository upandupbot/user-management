# Fly.io config — deploy with:
#   fly launch --no-deploy   (accept this config; pick a region near you)
#   fly secrets set PIPEFY_API_TOKEN=... SWAP_WEB_PASSWORD=...
#   fly deploy
# Optional secrets: PAPERTRAIL_LOG_TOKEN, SWAP_AUDIT_SHEET_ID,
#   SWAP_AUDIT_SERVICE_ACCOUNT_JSON (paste whole key-file JSON).
app = "swap-assignee"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
