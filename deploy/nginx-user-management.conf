# nginx location for the user-management (assignee swap) app.
# Paste inside the existing `server { listen 80; ... }` block for
# 13.246.163.179 (e.g. /etc/nginx/sites-available/default), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# proxy_pass has NO trailing slash on purpose: nginx forwards the full
# /user-management/... path and the app strips the prefix itself.

location = /user-management {
    return 301 /user-management/;
}

location /user-management/ {
    proxy_pass http://127.0.0.1:5010;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Scan/preview endpoints stream NDJSON progress; don't buffer them.
    proxy_buffering off;
    proxy_cache off;

    # Apply replies only once every selected card is done; a big job
    # (hundreds of cards, 250ms between writes) can take well over 10
    # minutes. Keep the connection open long enough that the browser gets
    # the real result instead of a 504 while the server is still working.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 5m;
}
