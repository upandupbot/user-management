# nginx location for the STAGING copy of the user-management app.
# Paste inside the same `server { listen 80; ... }` block as the live
# /user-management blocks, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# /user-management-staging/ doesn't overlap /user-management/ (the next
# character is "-", not "/"), so the two copies never catch each other's
# requests.

location = /user-management-staging {
    return 301 /user-management-staging/;
}

location /user-management-staging/ {
    proxy_pass http://127.0.0.1:5011;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 5m;
}
